name: Cybersecurity README audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cybersecurity-readme-audit.yml"
      - "scripts/audit-security-readmes.py"

permissions:
  contents: read
  issues: write

concurrency:
  group: cybersecurity-readme-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Audit featured cybersecurity READMEs
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit script
        uses: actions/checkout@v4

      - name: Run deterministic README audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/audit-security-readmes.py | tee readme-audit-report.md

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: cybersecurity-readme-audit
          path: readme-audit-report.md
          retention-days: 30

      - name: Create or update review issue
        uses: actions/github-script@v7
        env:
          REPORT_PATH: readme-audit-report.md
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const marker = '<!-- cybersecurity-readme-audit -->';
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const body = `${marker}\n${report}\n\n_This issue is generated by the Cybersecurity README audit workflow. Review changes through a pull request; this workflow never rewrites README files automatically._`;
            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 100
            });
            const match = existing.find(issue => issue.body && issue.body.includes(marker));
            if (match) {
              await github.rest.issues.update({ owner, repo, issue_number: match.number, title: 'Cybersecurity README audit — review findings', body });
              core.info(`Updated issue #${match.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title: 'Cybersecurity README audit — review findings', body, labels: ['documentation'] });
              core.info(`Created issue #${created.data.number}`);
            }
